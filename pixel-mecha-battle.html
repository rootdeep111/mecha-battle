                else if (r < 0.7 && bot.projectileCooldown <= 0) this.botCurrentAction = 'ranged';
                else if (r < 0.8 && bot.rage >= ULTIMATE_COST && bot.skillCooldown <= 0) this.botCurrentAction = 'ultimate';
                else this.botCurrentAction = 'approach';
            } else {
                // 远距离：快速接近，或使用闪现拉近距离
                const r = Math.random();
                if (r < 0.15 && bot.flashCooldown <= 0) this.botCurrentAction = 'flash';
                else if (r < 0.3 && bot.rage >= IMPRISON_COST && bot.skillCooldown <= 0) this.botCurrentAction = 'imprison';
                else this.botCurrentAction = 'approach';
            }
            this.botActionTimer = 10 + Math.floor(Math.random() * 15);
        }

        // --- 执行当前行为 ---
        this.botActionTimer--;
        switch (this.botCurrentAction) {
            case 'approach':
                if (dx > 10) inp.right = true;
                else if (dx < -10) inp.left = true;
                // 接近时如果目标在高处且自己在地面，跳跃
                if (dy < -40 && bot.onGround()) inp.jump = true;
                break;
            case 'attack':
                if (dist > 55) {
                    // 还不够近，先靠近
                    if (dx > 0) inp.right = true; else inp.left = true;
                } else {
                    inp.attack = true;
                }
                break;
            case 'defend':
                inp.defend = true;
                break;
            case 'ranged':
                inp.ranged = true;
                // 同时微调朝向
                if (dx > 10) inp.right = true; else if (dx < -10) inp.left = true;
                break;
            case 'flash':
                inp.flash = true;
                // 闪现后继续接近
                if (dx > 0) inp.right = true; else inp.left = true;
                break;
            case 'imprison':
                inp.imprison = true;
                break;
            case 'ultimate':
                inp.ultimate = true;
                break;
        }

        // --- 被动反应：对手正在攻击且距离近时，有概率防御 ---
        if (target.attackActive && dist < 70 && Math.random() < 0.35) {
            inp.defend = true;
            inp.right = false;
            inp.left = false;
        }

        // --- 被动反应：血量低时更倾向防御和拉开距离 ---
        if (bot.hp < 100 && Math.random() < 0.02) {
            this.botCurrentAction = 'retreat';
        }
        if (this.botCurrentAction === 'retreat') {
            if (dx > 0) inp.left = true; else inp.right = true;
            if (Math.random() < 0.3) inp.defend = true;
        }

        // --- 怒气满时优先使用大招 ---
        if (bot.rage >= ULTIMATE_COST && bot.skillCooldown <= 0 && dist < 300 && Math.random() < 0.02) {
            inp.ultimate = true;
            this.botCurrentAction = 'ultimate';
        }

        // --- 空中喷气恢复（偶尔在空中喷气延缓下落） ---
        if (!bot.onGround() && bot.jetFuel > 50 && dy < -60 && Math.random() < 0.1) {
            inp.jet = true;
        }

        // 写回 botInput
        this.botInput = inp;
    }

    handleCombat() {
        const m1 = this.mecha1;
        const m2 = this.mecha2;

        // 近战攻击判定（机甲间不再碰撞，可互相穿过）
        if (m1.attackActive && m1.attackHitbox) {
            this.checkAttackHit(m1, m2);
            this.checkAttackOnPlatforms(m1);
            this.checkAttackOnBarrels(m1);
        }
        if (m2.attackActive && m2.attackHitbox) {
            this.checkAttackHit(m2, m1);
            this.checkAttackOnPlatforms(m2);
            this.checkAttackOnBarrels(m2);
        }
    }

    checkAttackHit(attacker, target) {
        if (target.state === 'dead' || target.hitStun > 0) return;

        const hb = attacker.attackHitbox;
        const tx = target.x;
        const ty = target.y;
        const tw = target.width;
        const th = target.height;

        if (hb.x < tx + tw && hb.x + hb.width > tx &&
            hb.y < ty + th && hb.y + hb.height > ty) {
            // 使用连击段位伤害和击退参数
            target.takeDamage(hb.damage, attacker, {
                knockback: hb.knockback,
                knockdown: hb.knockdown
            });
            attacker.attackActive = false; // 一帧只命中一次
            attacker.onAttackHit(); // 标记命中，开启取消窗口
        }
    }

    // 近战攻击命中平台（平台受损）
    checkAttackOnPlatforms(attacker) {
        const hb = attacker.attackHitbox;
        for (const p of platforms) {
            if (p.broken) continue;
            if (hb.x < p.x + p.width && hb.x + hb.width > p.x &&
                hb.y < p.y + p.height && hb.y + hb.height > p.y) {
                p.takeHit();
                attacker.attackActive = false;
                break;
            }
        }
    }

    // 近战攻击命中木桶（木桶受损）
    checkAttackOnBarrels(attacker) {
        const hb = attacker.attackHitbox;
        for (const b of barrels) {
            const hitbox = b.getHitbox();
            if (!hitbox) continue;
            if (hb.x < hitbox.x + hitbox.width && hb.x + hb.width > hitbox.x &&
                hb.y < hitbox.y + hitbox.height && hb.y + hb.height > hitbox.y) {
                b.takeHit();
                attacker.attackActive = false;
                break;
            }
        }
    }

    // 弹幕更新与碰撞检测
    handleProjectiles() {
        for (let i = projectiles.length - 1; i >= 0; i--) {
            const proj = projectiles[i];
            proj.update();

            if (proj.dead) {
                projectiles.splice(i, 1);
                continue;
            }

            // 弹幕命中机甲（不命中发射者）
            const targets = [this.mecha1, this.mecha2].filter(m => m !== proj.owner && m.hp > 0);
            for (const target of targets) {
                const hb = proj.getHitbox();
                if (hb.x < target.x + target.width && hb.x + hb.width > target.x &&
                    hb.y < target.y + target.height && hb.y + hb.height > target.y) {
                    // 弹幕造成远程伤害（无击倒）
                    target.takeDamage(PROJECTILE_DAMAGE, proj.owner, { knockback: 3 });
                    proj.dead = true;
                    break;
                }
            }
            if (proj.dead) {
                projectiles.splice(i, 1);
                continue;
            }

            // 弹幕命中平台
            for (const p of platforms) {
                if (p.broken) continue;
                const hb = proj.getHitbox();
                if (hb.x < p.x + p.width && hb.x + hb.width > p.x &&
                    hb.y < p.y + p.height && hb.y + hb.height > p.y) {
                    p.takeHit();
                    proj.dead = true;
                    spawnParticles(proj.x, proj.y, 5, proj.color, 3);
                    break;
                }
            }
            if (proj.dead) {
                projectiles.splice(i, 1);
                continue;
            }

            // 弹幕命中木桶
            for (const b of barrels) {
                const hitbox = b.getHitbox();
                if (!hitbox) continue;
                const hb = proj.getHitbox();
                if (hb.x < hitbox.x + hitbox.width && hb.x + hb.width > hitbox.x &&
                    hb.y < hitbox.y + hitbox.height && hb.y + hb.height > hitbox.y) {
                    b.takeHit();
                    proj.dead = true;
                    spawnParticles(proj.x, proj.y, 5, proj.color, 3);
                    break;
                }
            }
            if (proj.dead) {
                projectiles.splice(i, 1);
                continue;
            }
        }
    }

    // 超级弹幕更新与碰撞检测（穿透，每个目标只命中一次）
    handleSuperProjectiles() {
        for (let i = superProjectiles.length - 1; i >= 0; i--) {
            const sp = superProjectiles[i];
            sp.update();
            if (sp.dead) { superProjectiles.splice(i, 1); continue; }

            // 激光束每 5 帧对路径内目标造成一次伤害
            if (sp.damageTimer >= 5) {
                sp.damageTimer = 0;
                const hb = sp.getHitbox();

                // 命中机甲
                const targets = [this.mecha1, this.mecha2].filter(m => m !== sp.caster && m.hp > 0);
                for (const target of targets) {
                    if (hb.x < target.x + target.width && hb.x + hb.width > target.x &&
                        hb.y < target.y + target.height && hb.y + hb.height > target.y) {
                        target.takeDamage(SUPER_PROJECTILE_DAMAGE, sp.caster, { knockback: 3 });
                    }
                }
                // 命中平台
                for (const p of platforms) {
                    if (p.broken) continue;
                    if (hb.x < p.x + p.width && hb.x + hb.width > p.x &&
                        hb.y < p.y + p.height && hb.y + hb.height > p.y) {
                        p.takeHit();
                    }
                }
                // 命中木桶
                for (const b of barrels) {
                    const hitbox = b.getHitbox();
                    if (!hitbox) continue;
                    if (hb.x < hitbox.x + hitbox.width && hb.x + hb.width > hitbox.x &&
                        hb.y < hitbox.y + hitbox.height && hb.y + hb.height > hitbox.y) {
                        b.takeHit();
                    }
                }
            }
        }
    }

    updateEffects() {
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
        for (let i = damageNumbers.length - 1; i >= 0; i--) {
            damageNumbers[i].update();
            if (damageNumbers[i].life <= 0) damageNumbers.splice(i, 1);
        }

        // 木桶爆炸范围伤害 + 刷新
        for (let i = barrels.length - 1; i >= 0; i--) {
            const b = barrels[i];
            if (!b.destroyed) continue;

            // 爆炸伤害（逐帧检查直到有人受伤或窗口结束）
            if (!b.explosionApplied) {
                let anyHit = false;
                const targets = [this.mecha1, this.mecha2];
                for (const m of targets) {
                    if (m.hp <= 0) continue;
                    if (b.checkExplosionDamage(m)) {
                        m.takeDamage(b.explosionDamage, null, { knockback: 8, knockdown: true });
                        anyHit = true;
                    }
                }
                // 爆炸连锁
                for (const other of barrels) {
                    if (other === b || other.destroyed) continue;
                    const cx = b.x + b.width / 2;
                    const cy = b.y + b.height / 2;
                    const ox = other.x + other.width / 2;
                    const oy = other.y + other.height / 2;
                    const dist = Math.sqrt((cx - ox) ** 2 + (cy - oy) ** 2);
                    if (dist < b.explosionRadius * 0.7) {
                        other.takeHit();
                        anyHit = true;
                    }
                }
                // 有人受伤或窗口结束后标记已处理
                if (anyHit || b.explosionTimer > 12) {
                    b.explosionApplied = true;
                }
            }

            // 爆炸动画结束后，在世界范围内随机位置刷新新木桶（可在地面或平台上）
            if (b.explosionTimer > 30 && !b.hasRespawned) {
                barrels.push(this.spawnBarrelRandomly());
                b.hasRespawned = true;
            }

            // 完全结束后从数组移除（避免无限增长）
            if (b.explosionTimer > 60) {
                barrels.splice(i, 1);
            }
        }
    }

    draw() {
        // 清空画布
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (this.state === 'menu') {
            this.drawMenu();
            return;
        }

        if (this.isSplitScreen) {
            // 左半屏（玩家1）
            this.drawWorld(this.camera.x1, this.camera.y1, 0, canvas.width / 2);
            // 分隔线
            ctx.fillStyle = '#222';
            ctx.fillRect(canvas.width / 2 - 2, 0, 4, canvas.height);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 - 2, 0);
            ctx.lineTo(canvas.width / 2 - 2, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 + 2, 0);
            ctx.lineTo(canvas.width / 2 + 2, canvas.height);
            ctx.stroke();
            // 右半屏（玩家2）
            this.drawWorld(this.camera.x2, this.camera.y2, canvas.width / 2, canvas.width / 2);
        } else {
            // 正常合屏
            this.drawWorld(this.camera.x, this.camera.y, 0, canvas.width);
        }

        // === 屏幕坐标绘制（不受摄像机偏移）===
        // 绘制UI
        drawUI(ctx, this.mecha1, this.mecha2, this.isSplitScreen);

        if (this.state === 'gameover') {
            this.drawGameOver();
        }
    }

    // 绘制半个屏幕的世界内容
    drawWorld(camX, camY, screenX, screenWidth) {
        ctx.save();
        // 设置clip区域（屏幕坐标）
        ctx.beginPath();
        ctx.rect(screenX, 0, screenWidth, canvas.height);
        ctx.clip();
        // 应用相机偏移：使世界坐标 camX 映射到屏幕 screenX
        ctx.translate(screenX - camX, -camY);

        // 绘制背景
        drawBackground(ctx, camX, camY);

        // 绘制悬浮平台（在机甲之下）
        platforms.forEach(p => p.draw(ctx));

        // 绘制木桶（在地面之上、机甲之下）
        barrels.forEach(b => b.draw(ctx));

        // 绘制残影（在机甲之下）
        afterimages.forEach(a => drawAfterimage(ctx, a));

        // 绘制机甲
        this.mecha1.draw(ctx);
        this.mecha2.draw(ctx);

        // 绘制弹幕
        projectiles.forEach(p => p.draw(ctx));

        // 绘制超级弹幕
        superProjectiles.forEach(p => p.draw(ctx));

        // 绘制禁锢笼子
        cageEffects.forEach(c => drawCage(ctx, c));

        // 绘制粒子
        particles.forEach(p => p.draw(ctx));

        // 绘制伤害数字
        damageNumbers.forEach(d => d.draw(ctx));

        // 绘制攻击特效线
        if (this.mecha1.attackActive) this.drawAttackEffect(ctx, this.mecha1);
        if (this.mecha2.attackActive) this.drawAttackEffect(ctx, this.mecha2);

        // 弹反提示（世界坐标层）
        drawParryIndicator(ctx, this.mecha1);
        drawParryIndicator(ctx, this.mecha2);

        ctx.restore();
    }

    drawAttackEffect(ctx, mecha) {
        const x = mecha.x + mecha.width / 2;
        const y = mecha.y + 25;
        const len = 40 + (mecha.comboStage - 1) * 10;
        const angle = (mecha.facing > 0 ? 0 : Math.PI) + (Math.random() - 0.5) * 0.5;

        // 连击段位越高特效越强烈
        const effectColor = mecha.comboStage === 3 ? '#e74c3c' : (mecha.comboStage === 2 ? '#f39c12' : mecha.colors.accent);
        ctx.strokeStyle = effectColor;
        ctx.lineWidth = 3 + mecha.comboStage;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
        ctx.stroke();
    }

                const accentColor = this.gameMode === 'pvp' ? '#e74c3c' : '#9b59b6';
                const lightColor = this.gameMode === 'pvp' ? '#f1948a' : '#bb8fce';
                const darkColor = this.gameMode === 'pvp' ? '#ec7063' : '#7d3c98';

                ctx.fillStyle = selected ? `rgba(${this.gameMode === 'pvp' ? '231,76,60' : '155,89,182'},0.3)` : 'rgba(50,50,50,0.5)';
                ctx.fillRect(cardX, cardY, 320, 68);
                if (selected) {
                    ctx.strokeStyle = accentColor;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(cardX, cardY, 320, 68);
                }

                this.drawWeaponIcon(ctx, cardX + 30, cardY + 34, wk, accentColor, lightColor, darkColor);

                const nameColor = selected ? accentColor : '#666';
                drawPixelText(ctx, w.name, cardX + 70, cardY + 16, 16, nameColor, 'left');
                drawPixelText(ctx, w.desc, cardX + 70, cardY + 34, 10, selected ? '#aaa' : '#555', 'left');
                drawPixelText(ctx, '伤害:' + w.comboDamage.join('/') + '  防御:' + w.defense + '  移速:' + w.moveSpeed,
                    cardX + 70, cardY + 50, 10, selected ? '#888' : '#444', 'left');
            }

            if (this.gameMode === 'pvp') {
                drawPixelText(ctx, '7/8 切换武器', canvas.width - 240, 410, 13, '#ec7063');
            } else {
                drawPixelText(ctx, 'Bot 将随机选择武器', canvas.width - 240, 410, 13, '#bb8fce');
            }

            // VS分隔线
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 130);
            ctx.lineTo(canvas.width / 2, 400);
            ctx.stroke();
            ctx.setLineDash([]);
            drawPixelText(ctx, 'VS', canvas.width / 2, 270, 28, '#f1c40f');

            // 操作说明（底部）
            drawPixelText(ctx, '玩家1: A/D W跳 J攻 K防 L远 U闪 I禁 O大 F喷气  |  玩家2: ←/→ ↑跳 1攻 2防 3远 4闪 5禁 6大 0喷气', canvas.width / 2, 448, 10, '#777');
            drawPixelText(ctx, '攻击/受击积攒怒气 | 1怒气=禁锢 2怒气=激光束(150伤) | 闪现无消耗 | 喷气飞行:空中长按5秒飞到顶,松手加快坠落', canvas.width / 2, 466, 10, '#666');

            // 开始提示
            const blink = Math.sin(Date.now() * 0.006) > 0;
            if (blink) {
                drawPixelText(ctx, '按 空格 开始战斗  |  ESC 返回模式选择', canvas.width / 2, 500, 18, '#fff');
            }
        }
    }

    // 菜单武器图标（静态像素图）
    drawWeaponIcon(ctx, x, y, weaponKey, mainColor, lightColor, accentColor) {
        if (weaponKey === 'dagger') {
            // 短刀图标：短匕首
            drawPixelRect(ctx, x - 1, y + 4, 3, 10, '#666');     // 柄
            drawPixelRect(ctx, x - 4, y + 2, 9, 3, '#666');     // 护手
            drawPixelRect(ctx, x - 1, y - 14, 3, 18, mainColor); // 刃
            drawPixelRect(ctx, x - 3, y - 10, 7, 14, lightColor); // 光晕
            drawPixelRect(ctx, x - 1, y - 16, 3, 3, '#fff');      // 尖
        } else if (weaponKey === 'spear') {
            // 长枪图标：长杆+枪头
            drawPixelRect(ctx, x - 1, y - 8, 2, 28, '#8B4513');  // 杆
            drawPixelRect(ctx, x - 5, y - 20, 10, 6, mainColor); // 枪头宽部
            drawPixelRect(ctx, x - 2, y - 28, 4, 10, mainColor); // 枪尖
            drawPixelRect(ctx, x - 7, y - 18, 14, 3, lightColor); // 光
            drawPixelRect(ctx, x - 1, y - 30, 2, 4, '#fff');      // 尖端
        } else {
            // 剑盾图标：左手盾+右手剑
            // 盾（左侧）
            drawPixelRect(ctx, x - 16, y - 10, 10, 22, mainColor);
            drawPixelRect(ctx, x - 14, y - 8, 6, 18, lightColor);
            drawPixelRect(ctx, x - 12, y - 4, 3, 10, accentColor);
            // 剑（右侧）
            drawPixelRect(ctx, x + 6, y + 2, 3, 10, '#666');     // 柄
            drawPixelRect(ctx, x + 6, y - 16, 3, 20, mainColor); // 剑身
            drawPixelRect(ctx, x + 4, y - 14, 7, 16, lightColor); // 光
            drawPixelRect(ctx, x + 7, y - 18, 1, 3, '#fff');      // 尖
        }
    }

    drawMenuMecha(ctx, x, y, facing, primary) {
        ctx.save();
        ctx.translate(x, y);

        const c = { primary, dark: '#1a1a1a', light: primary, eye: '#f1c40f', joint: '#666' };

        // 简单机甲绘制
        drawPixelRect(ctx, -20, 0, 40, 30, c.primary);
        drawPixelRect(ctx, -14, -20, 28, 22, c.primary);
        drawPixelRect(ctx, -10, -16, 20, 14, c.dark);
        drawPixelRect(ctx, facing > 0 ? 0 : -6, -14, 6, 4, c.eye);
        drawPixelRect(ctx, -26, 5, 10, 20, c.primary);
        drawPixelRect(ctx, 16, 5, 10, 20, c.primary);
        drawPixelRect(ctx, -16, 30, 12, 20, c.dark);
        drawPixelRect(ctx, 4, 30, 12, 20, c.dark);

        ctx.restore();
    }

    drawGameOver() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let winnerLabel, winnerColor;
        if (this.winner.isPlayer1) {
            winnerLabel = '玩家1 获胜！';
            winnerColor = '#3498db';
        } else {
            if (this.gameMode === 'pve') {
                winnerLabel = 'AI Bot 获胜！';
            } else {
                winnerLabel = '玩家2 获胜！';
            }
            winnerColor = '#e74c3c';
        }

        drawPixelText(ctx, '游戏结束', canvas.width / 2, 220, 48, '#fff');
        drawPixelText(ctx, winnerLabel, canvas.width / 2, 280, 36, winnerColor);

        if (this.gameOverTimer > 60) {
            const blink = Math.sin(Date.now() * 0.005) > 0;
            if (blink) {
                drawPixelText(ctx, '按 空格 返回菜单', canvas.width / 2, 340, 18, '#aaa');
            }
        }
    }

    drawHitboxes() {
        [this.mecha1, this.mecha2].forEach(m => {
            ctx.strokeStyle = '#0f0';
            ctx.strokeRect(m.x, m.y, m.width, m.height);
            if (m.attackHitbox) {
                ctx.strokeStyle = '#f00';
                ctx.strokeRect(m.attackHitbox.x, m.attackHitbox.y,
                    m.attackHitbox.width, m.attackHitbox.height);
            }
        });
    }
}

// ===================== 启动 =====================
let game; // 全局游戏实例（供 Mecha.getInput 等访问）
(function startGame() {
    game = new Game();

    // 自动聚焦画布，确保键盘事件被正确接收
    canvas.focus();
    window.addEventListener('click', () => canvas.focus());

    // 在事件回调中直接处理菜单按键（最可靠，不依赖帧循环）
    window.addEventListener('keydown', (e) => {
        const key = e.key;
        if (game.state === 'menu') {
            if (game.menuMode === 'modeSelect') {
                // 模式选择：1=单机, 2=多人
                if (key === '1') {
                    game.gameMode = 'pve';
                    game.menuMode = 'weaponSelect';
                    e.preventDefault();
                }
                if (key === '2') {
                    game.gameMode = 'pvp';
                    game.menuMode = 'weaponSelect';
                    e.preventDefault();
                }
            } else if (game.menuMode === 'weaponSelect') {
                // 玩家1武器选择
                if (key === 'q' || key === 'Q') {
                    game.p1WeaponIdx = (game.p1WeaponIdx - 1 + WEAPON_KEYS.length) % WEAPON_KEYS.length;
                    e.preventDefault();
                }
                if (key === 'e' || key === 'E') {
                    game.p1WeaponIdx = (game.p1WeaponIdx + 1) % WEAPON_KEYS.length;
                    e.preventDefault();
                }
                // PVP模式玩家2武器选择
                if (game.gameMode === 'pvp') {
                    if (key === '7') {
                        game.p2WeaponIdx = (game.p2WeaponIdx - 1 + WEAPON_KEYS.length) % WEAPON_KEYS.length;
                        e.preventDefault();
                    }
                    if (key === '8') {
                        game.p2WeaponIdx = (game.p2WeaponIdx + 1) % WEAPON_KEYS.length;
                        e.preventDefault();
                    }
                }
                // 开始游戏
                if (key === ' ' || key === 'Enter') {
                    if (game.gameMode === 'pve') {
                        game.p2WeaponIdx = Math.floor(Math.random() * WEAPON_KEYS.length);
                    }
                    game.state = 'playing';
                    game.reset();
                    e.preventDefault();
                }
                // ESC返回模式选择
                if (key === 'Escape') {
                    game.menuMode = 'modeSelect';
                    e.preventDefault();
                }
            }
        } else if (game.state === 'gameover' && game.gameOverTimer > 60) {
            if (key === ' ' || key === 'Enter') {
                game.state = 'menu';
                game.menuMode = 'modeSelect';
                e.preventDefault();
            }
        }
    });

    // 点击页面只返回菜单
    window.addEventListener('mousedown', () => {
        if (game.state === 'gameover' && game.gameOverTimer > 60) {
            game.state = 'menu';
            game.menuMode = 'modeSelect';
        }
    });

    Input.init();

    const startBtn = document.getElementById('startBtn');
    startBtn.addEventListener('click', () => {
        if (game.state === 'gameover' && game.gameOverTimer > 60) {
            game.state = 'menu';
        }
    });

    function gameLoop() {
        game.update();
        game.draw();

        // 同步按钮显示状态（菜单中不显示按钮，必须用键盘选武器+空格开始）
        if (game.state === 'gameover' && game.gameOverTimer > 60) {
            startBtn.style.display = 'block';
            startBtn.textContent = '返回菜单';
        } else {
            startBtn.style.display = 'none';
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();

    // ===================== PWA Service Worker 注册 =====================
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then((reg) => console.log('PWA Service Worker 已注册，可离线使用'))
                .catch((err) => console.log('Service Worker 注册失败:', err));
        });
    }
})();
</script>
